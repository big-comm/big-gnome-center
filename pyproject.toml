[project]
name = "big-gnome-center"
version = "3.0.0"
description = "BigLinux GNOME desktop configuration center"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["usr/share/big-gnome-center"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E402: module-level import not at top — unavoidable after gi.require_version()
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# CSS-in-Python string → long lines unavoidable
"usr/share/big-gnome-center/ui/styles.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["usr/share/big-gnome-center"]
